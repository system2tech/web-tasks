<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Web Page with Different Elements</title>
    <style>
        /* Basic styling for the page */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        label {
            font-weight: bold;
            display: block;
            margin: 10px 0 5px;
        }
        .hidden {
            display: none;
        }
        .clickable {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Test Web Page with Different Elements</h1>

        <div>
            <a href="#" id="learnMore">Learn more about this page</a>
        </div>
        <div id="moreInfo">
        </div>

        <div id="div1">
        <!-- Text input -->
        <label for="textInput">Text Input:</label>
        <input type="text" id="textInput" placeholder="Enter text here">
        <div>
            Select the pick-up location
            <div class="clickable" id="locationSelector">
            </div>
            &nbsp;
            <div>
            Some information about the location
            </div>
        </div>

        <div>
            <!-- Password input -->
        <label for="passwordInput">Password Input:</label>
        <input type="password" id="passwordInput" placeholder="Enter password">
        </div>

        <div>
        <!-- Number input -->
        <label for="numberInput">Number Input:</label>
        <input type="number" id="numberInput" placeholder="Enter a number">
        </div>

        <div>
        <!-- Email input -->
        <label for="emailInput">Email Input:</label>
        <input type="email" id="emailInput" placeholder="Enter your email">
        </div>

        <div>
        <!-- Radio buttons -->
        <label>Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        </div>

    </div>

    <script>
        // Simple script to toggle the hidden div when clicking a button
        document.getElementById('submitButton').addEventListener('click', function() {
            const hiddenDiv = document.getElementById('hiddenDiv');
            hiddenDiv.classList.toggle('hidden');
        });
        document.getElementById('submitButton').addEventListener('click', function() {
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.textContent = "Status: Submitted";
        });
        document.getElementById('learnMore').addEventListener('click', function(event) {
            event.preventDefault(); // Prevent default navigation
            const moreInfo = document.getElementById('moreInfo');
            moreInfo.textContent = "This page contains different types of form elements.";
        });
    </script>

</body>
</html>
